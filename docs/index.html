 apply(){const F=this.F,s=F.q.toLowerCase(),cs=$$('#cards .qc');this.vis=[];
  cs.forEach(c=>{const d=c.dataset;let ok=F.tiers[d.tier]&&(!F.prof||d.prof===F.prof)&&(!F.lec||d.lec===F.lec)&&(+d.n>=F.n);
   if(ok&&F.ver==='flag')ok=(d.v==='diff'||d.v==='part');if(ok&&F.ver==='none')ok=d.v==='none';
   if(ok&&F.mine==='bm')ok=!!MK.bm[d.id];if(ok&&F.mine==='ng')ok=!!MK.ng[d.id];if(ok&&F.mine==='todo')ok=!MK.ok[d.id]&&!MK.ng[d.id];
   if(ok&&s)ok=c.textContent.toLowerCase().includes(s);c.classList.toggle('hid',!ok);
   let o=+d.idx;if(F.sort==='n')o=(9-+d.n)*1e5+(99-+d.y0)*1e3+ +d.idx;else if(F.sort==='y')o=(99-+d.y0)*1e5+(9-+d.n)*1e3+ +d.idx;else if(F.sort==='r')o=Math.floor(Math.random()*1e6);c.style.order=o;c._o=o;if(ok)this.vis.push(c);});

 if(d.ptype!==undefined&&t.closest('#ppills')){$$('#ppills [data-ptype]').forEach(b=>b.classList.toggle('on',b===t));$$('#stage .pc').forEach(c=>c.classList.toggle('hid',!!d.ptype&&c.dataset.ptype!==d.ptype));return;}
 if(t.id==='fcard'){Flash.back=!Flash.back;Flash.draw();return;}if(t.id==='fprev'){Flash.i=(Flash.i-1+Flash.deck.length)%Flash.deck.length;Flash.back=false;Flash.draw();return;}if(t.id==='fnext'){Flash.i=(Flash.i+1)%Flash.deck.length;Flash.back=false;Flash.draw();return;}if(t.id==='fshuf'){Flash.deck.sort(()=>Math.random()-.5);Flash.i=0;Flash.back=false;Flash.draw();return;}
 if(d.tog){t.closest('article').classList.toggle('open');return;}

 if(d.jb){openImg('jb',d.jb);return;}

 if(d.go){go(d.go);return;}

 if(t.id==='oprev'){JB.cur--;JB.show();window.scrollTo(0,0);return;}if(t.id==='onext'){JB.cur++;JB.show();window.scrollTo(0,0);return;}});
$('#stage').addEventListener('change',e=>{const t=e.target,F=JB.F;if(!F)return;if(t.id==='fprof')F.prof=t.value;else if(t.id==='flec')F.lec=t.value;else if(t.id==='fn')F.n=+t.value;else if(t.id==='fver')F.ver=t.value;else if(t.id==='fmine')F.mine=t.value;else if(t.id==='fsort')F.sort=t.value;else return;JB.apply();});

/* ---------- 형광펜·빈칸 도구 (블록 단위 저장: 다른 강의·과목이 추가·수정돼도 표시가 밀리지 않음) ---------- */
const Kit=(function(){let mode=null,color='y',S=null,ANN={},U=[],R=[];const SKIP='button,.noann,select,input,textarea,summary,.chip,.badge,.kbd,.ntag,.ybadge';
 const BND=/[\s\/()\[\]{}.,;:·→"'“”‘’<>=+~|!?—–]/;
 function load(s){S=s;ANN=LS.get('ann.'+s,{});U=[];R=[];upd();}function persist(){LS.set('ann.'+S,ANN);}
 function blockOf(n){let p=n.parentElement;while(p&&!/^(P|LI|TD|TH|DIV|SECTION|ARTICLE|H1|H2|H3|H4|TR|UL|OL|TABLE|FIGCAPTION|SUMMARY|DETAILS)$/.test(p.nodeName))p=p.parentElement;return p;}
 function index(B){const w=document.createTreeWalker(B,NodeFilter.SHOW_TEXT,null);let s='',map=[],n;while(n=w.nextNode()){if(!n.nodeValue)continue;const p=n.parentElement;if(!p||p.closest(SKIP))continue;map.push({n,start:s.length,len:n.nodeValue.length});s+=n.nodeValue;}return{s,map};}
 function wrap(B,a,b,t,c){const map=index(B).map;for(let k=map.length-1;k>=0;k--){const m=map[k];if(m.n.parentElement.closest('[data-rk]'))continue;const s=Math.max(a,m.start),e=Math.min(b,m.start+m.len);if(e<=s)continue;let node=m.n,from=s-m.start,to=e-m.start;if(from>0){node=node.splitText(from);to-=from;}if(to<node.nodeValue.length)node.splitText(to);if(!node.nodeValue.trim())continue;const el=document.createElement('span');el.setAttribute('data-rk',t);if(t==='b')el.className='rk-b';else{el.className='rk-h rk-'+c;el.setAttribute('data-c',c);}node.parentNode.insertBefore(el,node);el.appendChild(node);}}
 function snap(B){const ix=index(B),out=[];$$('[data-rk]',B).forEach(el=>{const x=el.textContent;if(!x)return;const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,null);const tn=w.nextNode();const m=ix.map.find(q=>q.n===tn);if(!m)return;let i=0,p=-1;while((p=ix.s.indexOf(x,p+1))>=0&&p<m.start)i++;const o={t:el.getAttribute('data-rk'),x,i};if(o.t==='h')o.c=el.getAttribute('data-c')||'y';out.push(o);});return out;}
 function unwrap(el){const p=el.parentNode;while(el.firstChild)p.insertBefore(el.firstChild,el);p.removeChild(el);p.normalize();}
 function restore(root){$$('[data-aid]',root).forEach(B=>{const list=ANN[B.dataset.aid];if(!list)return;list.forEach(a=>{const s=index(B).s;let p=-1;for(let k=0;k<=(a.i||0);k++){p=s.indexOf(a.x,p+1);if(p<0)break;}if(p>=0)wrap(B,p,p+a.x.length,a.t,a.c||'y');});});}
 function redraw(){const st=$('#stage');$$('[data-rk]',st).forEach(unwrap);restore(st);}
 function push(){U.push(JSON.stringify(ANN));if(U.length>60)U.shift();R=[];upd();}
 function commit(B){const l=snap(B);if(l.length)ANN[B.dataset.aid]=l;else delete ANN[B.dataset.aid];persist();}
 function upd(){$('#k-undo').disabled=!U.length;$('#k-redo').disabled=!R.length;}
 function undo(){if(!U.length)return;R.push(JSON.stringify(ANN));ANN=JSON.parse(U.pop());persist();redraw();upd();}function redo(){if(!R.length)return;U.push(JSON.stringify(ANN));ANN=JSON.parse(R.pop());persist();redraw();upd();}
 function setMode(m){mode=(mode===m?null:m);$('#k-h').classList.toggle('on',mode==='h');$('#k-b').classList.toggle('on',mode==='b');document.body.classList.toggle('mode-h',mode==='h');document.body.classList.toggle('mode-b',mode==='b');}
 function caret(e){if(document.caretRangeFromPoint)return document.caretRangeFromPoint(e.clientX,e.clientY);if(document.caretPositionFromPoint){const p=document.caretPositionFromPoint(e.clientX,e.clientY);if(p){const r=document.createRange();r.setStart(p.offsetNode,p.offset);return r;}}return null;}
 function wordAt(B,node,off){const ix=index(B),m=ix.map.find(q=>q.n===node);if(!m)return null;const s=ix.s;let i=m.start+off;const bset={};let prev=null;ix.map.forEach(q=>{const b=blockOf(q.n);if(b!==prev){bset[q.start]=1;prev=b;}});
  if(i>=s.length||BND.test(s[i])){if(i>0&&!BND.test(s[i-1]))i--;else return null;}let a=i,b=i+1;while(a>0&&!BND.test(s[a-1])&&!bset[a])a--;while(b<s.length&&!BND.test(s[b])&&!bset[b])b++;return[a,b];}
 function handleClick(e){const rk=e.target.closest&&e.target.closest('[data-rk]');
  if(rk&&!mode&&rk.getAttribute('data-rk')==='b'){const x=rk.textContent;rk.classList.toggle('show');return true;}
  if(!mode)return false;if(e.target.closest(SKIP)||e.target.closest('[data-ttog]'))return false;const B=e.target.closest('[data-aid]');if(!B)return false;
  const sel=getSelection();if(sel&&!sel.isCollapsed)return true;
  if(rk){push();unwrap(rk);commit(B);return true;}
  const r=caret(e);if(!r||r.startContainer.nodeType!==3)return true;const w=wordAt(B,r.startContainer,r.startOffset);if(!w)return true;push();wrap(B,w[0],w[1],mode,color);commit(B);return true;}
 document.addEventListener('mouseup',()=>{if(!mode)return;const sel=getSelection();if(!sel||sel.isCollapsed||!sel.rangeCount)return;const r=sel.getRangeAt(0);let el=r.startContainer;el=el.nodeType===1?el:el.parentElement;const B=el&&el.closest('#stage [data-aid]');if(!B)return;
  const ix=index(B);let a=null,b=null;ix.map.forEach(m=>{if(!r.intersectsNode(m.n))return;let s0=m.start,e0=m.start+m.len;if(m.n===r.startContainer)s0=m.start+r.startOffset;if(m.n===r.endContainer)e0=m.start+r.endOffset;if(a===null)a=s0;b=e0;});
  if(a===null||b<=a){sel.removeAllRanges();return;}while(a<b&&/\s/.test(ix.s[a]))a++;while(b>a&&/\s/.test(ix.s[b-1]))b--;if(b>a){push();wrap(B,a,b,mode,color);commit(B);}sel.removeAllRanges();});
 function auto(kind,one){const st=$('#stage');let sel=kind==='red'?'.k':kind==='term'?'tbody th':'tbody td';const els=$$(sel,st).filter(el=>el.offsetParent!==null||el.closest('.tbody,.ans'));if(!els.length){toast('이 화면에는 해당하는 대상이 없습니다');return;}
  push();const seen=new Set(),touched=new Set();els.forEach(el=>{const B=el.closest('[data-aid]');if(!B||el.closest('[data-rk]')||el.closest(SKIP))return;if(one){const row=el.closest('li,tr,p')||B;if(seen.has(row))return;seen.add(row);}
   const ix=index(B);const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,null);let tn=w.nextNode();while(tn&&!ix.map.find(q=>q.n===tn))tn=w.nextNode();if(!tn)return;const m=ix.map.find(q=>q.n===tn);let len=0;const w2=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,null);let n2;while(n2=w2.nextNode()){if(ix.map.find(q=>q.n===n2))len+=n2.nodeValue.length;}
   wrap(B,m.start,m.start+len,'b','y');touched.add(B);});touched.forEach(commit);toast('빈칸 '+$$('.rk-b',st).length+'개');}
 function clearView(){const st=$('#stage');const bs=new Set($$('[data-rk]',st).map(e=>e.closest('[data-aid]')));if(!bs.size)return;if(!confirm('지금 열린 화면의 형광펜·빈칸을 모두 지울까요?'))return;push();$$('[data-rk]',st).forEach(unwrap);bs.forEach(B=>B&&commit(B));}
 $('#k-sw').innerHTML=[['y','#FFE98A'],['g','#BFF0C6'],['p','#FFD0E0'],['o','#CFCFCF'],['n','#FFC27A']].map((c,i)=>`<span class="sw ${i?'':'sel'}" data-c="${c[0]}" style="background:${c[1]}"></span>`).join('');
 $('#k-sw').onclick=e=>{const s=e.target.closest('.sw');if(!s)return;color=s.dataset.c;$$('#k-sw .sw').forEach(x=>x.classList.toggle('sel',x===s));if(mode!=='h')setMode('h');};
 $('#k-h').onclick=()=>setMode('h');$('#k-b').onclick=()=>setMode('b');$('#k-undo').onclick=undo;$('#k-redo').onclick=redo;$('#k-clear').onclick=clearView;
 $('#k-eye').onclick=()=>{document.body.classList.toggle('rk-reveal');$('#k-eye').classList.toggle('on');};
 $('#k-auto').onclick=()=>$('#autopop').classList.toggle('on');$('#ago').onclick=()=>{auto($('input[name=am]:checked').value,$('#aone').checked);$('#autopop').classList.remove('on');};
 const hide=()=>document.body.classList.toggle('kit-off');$('#k-hide').onclick=hide;$('#kitshow').onclick=hide;
 const memo=()=>$('#memo').classList.toggle('on');$('#k-memo').onclick=memo;$('#memox').onclick=memo;let mt;$('#memota').oninput=()=>{clearTimeout(mt);mt=setTimeout(()=>{if(CUR.s)LS.set('memo.'+CUR.s+'.'+CUR.d,$('#memota').value);},400);};
 return{load,restore,handleClick,setMode,undo,redo,hide,memo,off(){if(mode)setMode(mode);$('#autopop').classList.remove('on');}};})();
/* ---------- 키보드 ---------- */
document.addEventListener('keydown',e=>{const tg=e.target;if(tg&&(/INPUT|SELECT|TEXTAREA/.test(tg.tagName)||tg.isContentEditable))return;
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?Kit.redo():Kit.undo();return;}if(e.ctrlKey||e.metaKey||e.altKey)return;
 if($('#imgmodal').classList.contains('on')){if(e.key==='Escape')$('#mclose').click();if(e.key==='ArrowLeft')$('#mprev').click();if(e.key==='ArrowRight')$('#mnext').click();return;}
 const k=e.key.toLowerCase();if(k==='escape'){Kit.off();return;}if(k==='h'){Kit.setMode('h');return;}if(k==='a'){Kit.setMode('b');return;}if(k==='m'){Kit.memo();return;}if(k==='v'){Kit.hide();return;}
 const n=+e.key,bs=$$('#dtabs button');if(n>=1&&n<=bs.length){bs[n-1].click();return;}
 if($('#fc')){if(e.key===' '){e.preventDefault();$('#fcard').click();}if(e.key==='ArrowLeft')$('#fprev').click();if(e.key==='ArrowRight')$('#fnext').click();return;}
 if(JB.one&&(CUR.d==='_jb'||CUR.t==='jb')){const c=JB.vis[JB.cur];if(e.key==='ArrowLeft')$('#oprev').click();if(e.key==='ArrowRight'||e.key==='Enter')$('#onext').click();if(e.key===' '){e.preventDefault();if(c)c.classList.toggle('open');}if(c&&(k==='o'||k==='x'||k==='b')){const kk=k==='o'?'ok':k==='x'?'ng':'bm';const btn=c.querySelector('[data-mk="'+kk+'"]');if(btn){btn.click();if(kk!=='bm'){JB.cur++;JB.show();window.scrollTo(0,0);}}}}});
/* ---------- 검색 ---------- */
let SIDX=null;function buildSearch(){SIDX=[];const tmp=document.createElement('div');for(const s in PACKS){const p=PACKS[s];const add=(d,t,html,label)=>{tmp.innerHTML=html;$$('[data-aid]',tmp).forEach(b=>SIDX.push({s,d,t,aid:b.dataset.aid,label,txt:b.textContent.replace(/\s+/g,' ')}));};
  p.lect.forEach(L=>add(L.k,'learn',L.learn,L.title+' · 학습'));add('_jb','',cardsHTML(p,p.order),'JB 문제');add('_tbl','',p.tables.map(x=>x.html).join(''),'비교표');add('_pred','',p.preds.map(x=>x.html).join(''),'예상문제');}}
let st_;$('#gsearch').addEventListener('input',e=>{clearTimeout(st_);st_=setTimeout(()=>{const q=e.target.value.trim().toLowerCase();if(q.length<2)return;if(!SIDX)buildSearch();const out=[];for(const r of SIDX){const i=r.txt.toLowerCase().indexOf(q);if(i<0)continue;out.push(r,i);if(out.length>=80)break;}
  let h=`<h2>검색: ${q.replace(/[<&]/g,'')}</h2><div class="lead">${out.length/2}건${out.length>=80?' 이상':''} — 누르면 해당 위치로 이동</div>`;for(let k=0;k<out.length;k+=2){const r=out[k],i=out[k+1];const sn=r.txt.slice(Math.max(0,i-40),i+q.length+70).replace(/[<&]/g,'');h+=`<button class="res" data-s="${r.s}" data-d="${r.d}" data-t="${r.t}" data-aid="${r.aid}"><b>${PACKS[r.s].title} · ${r.label}</b><div class="small">…${sn}…</div></button>`;}
  $('#subj').hidden=true;$('#home').hidden=false;$('#home').innerHTML=h;},250);});
/* ---------- 백업·복원 ---------- */
$('#bkup').onclick=()=>{tFlush();const o={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.indexOf(NS)===0)o[k]=localStorage.getItem(k);}const b=new Blob([JSON.stringify({app:'jblhub',v:1,at:new Date().toISOString(),data:o})],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='JBL허브_백업_'+day()+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},800);};
$('#rstr').onclick=()=>$('#rfile').click();$('#rfile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(j.app!=='jblhub')throw 0;if(!confirm('백업 파일의 표시·메모·기록으로 덮어쓸까요?'))return;for(const k in j.data)localStorage.setItem(k,j.data[k]);location.reload();}catch(_){toast('백업 파일을 읽지 못했어요');}};r.readAsText(f);};
/* ---------- 시작: 과목 팩 불러오기 ---------- */
function boot(){const m=/^#\/([^\/]+)\/([^\/]+)\/?([^\/]*)/.exec(location.hash);if(m&&PACKS[m[1]])openDoc(m[1],m[2],m[3]);else home();}
let pend=0;SUBJECTS.forEach(([id])=>{if(PACKS[id])return;pend++;const s=document.createElement('script');s.src='packs/'+id+'.js';s.onload=s.onerror=()=>{if(--pend===0)boot();};document.head.appendChild(s);});if(!pend)boot();
})();

<div class="wrap">

  <h1>JB 전수 검토 결정표</h1>
  <p class="lede">7과목 JB 23·24·25·26판(약리는 23q4 포함) 전 쪽을 사이트 카드와 하나하나 맞춘 결과예요. 아직 아무것도 고치지 않았어요. 항목마다 하나를 고르면 저장되고, 다 고르신 뒤 채팅에 <b>“결정했어”</b>라고만 하면 제가 읽어 가서 고칠게요. 고를 필요 없는 확인 결과는 과목마다 맨 아래 ‘확인만’에 있어요.</p>

12|Y|중|Q06 괄호 판본끼리 22·23 엇갈림|24판 (23,21,20) ↔ 25판 (24,22,21,20) · 26판 (25,24,22,21,20). 23판 2022 칸에 이 문제 없음 · 25·26판 2023 칸 5번 미복원. 사이트는 23·22 둘 다 → 6회.|그대로(괄호 규칙)*;22만;23만
13|F|중|P23 답 — 2)만인지 2)·5)인지|26판 p.9 JB 답 '?' · 해설 그림에서 B: opaque shade만 파란 글씨(= 보기 2)) · 그림의 E: translucent shade는 보기 5)와 같음.|2)만(파란 글씨)*;2)·5)
14|F|약|T16 등급 A ↔ 과목노트 C|JB 해설 '23년도 시험범위 아닙니다' · 같은 강의(211001 cervical restoration) T10·T11·T14·U01은 C. assemble.py는 'PLAN p.25-29 증례와 같은 형식'이라 A.|C로*;A 유지
15|F|약|사진 문항 안내 표기 통일|T17·P23엔 '🖼 그림 문항 — JB에 사진 없음' 안내가 있고 U01·U02·U04·T10·T16엔 없음.|통일*;그대로
16|F|참고|24판 번호 중복 라벨 '4b번'·'6b번'|24판 2023칸 '4.' 두 번 · 2022칸 '6.' 두 번 → 사이트 '4b'·'6b'(JB에 없는 표기).|'(JB 원문은 두 번째 4.)' 설명 덧붙임*;그대로
!26판 2024-3Q 13번 포인터 '2025 14번'은 JB 오기 — 지금 Q13 연결이 맞음
!R03 판마다 답이 다름(24판 1 / 25·26판 2,3,4,5) — 두 답 모두 보이고 ⚠ 메모 있음
!R20(답 같아 합침) · Q02 2021 사본(배지 20) · Q18 배지 22 · Q28 배지 21 — 괄호 근거 있음
!등급 C 카드(T10·T11·T14·T17·U01)는 짤/탈 칩 없이 '참고'만 — 설계상
!미복원 자리 15장·보기 미복원(Q11·Q20·Q21·R19·P11)·답 '?'(Q20·P23·P27) — JB 그대로(공통 X-5)
!24판 표지 '-2023 3Q JB-' — JB 표지 오기
`;

const CAT = {A:'누락',M:'합치기·나누기',L:'관련 링크',C:'교수',Y:'연도·짤탈',E:'내용·글자',F:'그 밖'};
const SURE = {'확실':'s1','강':'s2','중':'s3','약':'s4','참고':'s5'};
const SURE_LABEL = {'확실':'확실','강':'의심 강','중':'의심 중','약':'의심 약','참고':'참고'};
const LSK = 'jbaudit1024.picks';

const SUBJ = [];
(function parse(){
  let cur = null;
  for (const raw of DATA.split('\n')) {
    const line = raw.trim();
    if (!line) continue;
    if (line[0] === '#') {
      const sp = line.indexOf(' ');
      cur = {sid: line.slice(1, sp), name: line.slice(sp + 1), ov: '', items: [], info: []};
      SUBJ.push(cur);
    } else if (line[0] === '=') cur.ov = line.slice(1);
    else if (line[0] === '!') cur.info.push(line.slice(1));
    else {
      const f = line.split('|');
      if (f.length !== 6) { console.warn('bad line', line); continue; }
      const [num, cat, sure, title, det, opts] = f;
      cur.items.push({id: cur.sid + '-' + num, sid: cur.sid, num, cat, sure, title, det,
        opts: opts.split(';').filter(Boolean).map(o => ({label: o.replace(/\*$/, ''), rec: /\*$/.test(o)}))});
    }
  }
})();
const ALL = SUBJ.flatMap(s => s.items);
const BYID = Object.fromEntries(ALL.map(it => [it.id, it]));

let picks = {};
try { picks = JSON.parse(localStorage.getItem(LSK) || '{}') || {}; } catch (e) { picks = {}; }
const view = {sj: '', sure: '', cat: '', open: false};
try { const h = decodeURIComponent(location.hash.slice(1)); if (SUBJ.some(s => s.sid === h)) view.sj = h; } catch (e) {}

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $ = id => document.getElementById(id);
const isPicked = id => picks[id] && picks[id].i != null;
const sjLabel = sid => sid === 'X' ? '공통' : sid;

function summary() {
  const rows = SUBJ.map(s => {
    const miss = s.items.filter(it => it.cat === 'A' && it.sure === '확실').length;
    const sure = s.items.filter(it => it.sure === '확실').length;
    const done = s.items.filter(it => isPicked(it.id)).length;
    return `<tr><td><span class="dot" style="background:var(--c-${s.sid})"></span>${esc(sjLabel(s.sid))} <span style="color:var(--muted)">${esc(s.sid === 'X' ? '' : s.name)}</span></td>
      <td class="n ${miss ? 'miss' : 'zero'}">${miss || '0'}</td><td class="n">${s.items.length}</td><td class="n">${sure}</td><td class="n">${s.info.length}</td><td class="n" id="sd-${s.sid}">${done}</td></tr>`;
  }).join('');
  $('sum').innerHTML = `<table><thead><tr><th>과목</th><th style="text-align:right">누락 항목(확실)</th><th style="text-align:right">고를 항목</th><th style="text-align:right">그중 확실</th><th style="text-align:right">확인만</th><th style="text-align:right">고른 것</th></tr></thead><tbody>${rows}</tbody></table>`;
}

function sjChips() {
  const mk = (sid, label, n) => `<button class="chip" data-sj="${sid}" aria-pressed="${view.sj === sid}">${sid ? `<span class="dot" style="background:var(--c-${sid});margin:0"></span>` : ''}${esc(label)} <span class="k">${n}</span></button>`;
  $('sjrow').innerHTML = mk('', '전체', ALL.length) + SUBJ.map(s => mk(s.sid, sjLabel(s.sid), s.items.length)).join('');
}

function match(it) {
  if (view.sj && it.sid !== view.sj) return false;
  if (view.cat && it.cat !== view.cat) return false;
  if (view.sure === '확실' && it.sure !== '확실') return false;
  if (view.sure === '강중' && !['강', '중'].includes(it.sure)) return false;
  if (view.sure === '약참고' && !['약', '참고'].includes(it.sure)) return false;
  if (view.open && isPicked(it.id)) return false;
  return true;
}

function itemHTML(it) {
  const p = picks[it.id] || {};
  const opts = it.opts.map((o, i) => `<button class="opt" role="radio" aria-checked="${p.i === i}" data-id="${it.id}" data-i="${i}"><span class="no">${'①②③④⑤'[i]}</span><span>${esc(o.label)}</span>${o.rec ? '<span class="rc">추천</span>' : ''}</button>`).join('');
  return `<article class="it${p.i != null ? ' done' : ''}" id="it-${it.id}">
    <div class="ih"><span class="iid">${esc(sjLabel(it.sid))}-${esc(it.num)}</span><span class="cat">${CAT[it.cat] || ''}</span><span class="sure ${SURE[it.sure] || 's5'}">${SURE_LABEL[it.sure] || it.sure}</span>${p.i != null ? '<span class="picked">✓ 골랐음</span>' : ''}</div>
    <h3>${esc(it.title)}</h3>
    <p class="det">${esc(it.det)}</p>
    <div class="opts" role="radiogroup" aria-label="${esc(it.title)}">${opts}</div>
    <input class="note" id="note-${it.id}" data-id="${it.id}" placeholder="메모(선택) — 다른 안이면 여기에" value="${esc(p.n || '')}">
  </article>`;
}

function render() {
  sjChips();
  let html = '';
  for (const s of SUBJ) {
    if (view.sj && s.sid !== view.sj) continue;
    const items = s.items.filter(match);
    const filtered = view.sure || view.cat || view.open;
    if (!items.length && filtered && !view.sj) continue;
    html += `<section class="sj" id="sec-${s.sid}"><div class="sjh"><h2><span class="dot" style="background:var(--c-${s.sid})"></span>${esc(s.sid === 'X' ? s.name : s.sid + ' ' + s.name)}</h2><span class="cnt">${items.length}${filtered ? ' / ' + s.items.length : ''}개</span></div>
      <p class="ov">${esc(s.ov)}</p>
      <div class="list">${items.map(itemHTML).join('') || '<p class="empty">이 조건에 맞는 항목이 없어요.</p>'}</div>
      ${s.info.length ? `<details class="info"><summary>확인만 — 고를 것 없음 ${s.info.length}건</summary><ul>${s.info.map(t => `<li>${esc(t)}</li>`).join('')}</ul></details>` : ''}
    </section>`;
  }
  $('main').innerHTML = html || '<p class="empty">이 조건에 맞는 항목이 없어요.</p>';
  progress();
}

function progress() {
  const done = ALL.filter(it => isPicked(it.id)).length;
  $('ptext').textContent = `고른 것 ${done} / ${ALL.length}`;
  $('pfill').style.width = (ALL.length ? done / ALL.length * 100 : 0) + '%';
  for (const s of SUBJ) { const el = $('sd-' + s.sid); if (el) el.textContent = s.items.filter(it => isPicked(it.id)).length; }
}

function refreshItem(id) {
  const el = $('it-' + id); if (!el) { progress(); return; }
  const focused = document.activeElement && document.activeElement.id === 'note-' + id;
  if (focused) {
    const p = picks[id] || {};
    el.querySelectorAll('.opt').forEach(b => b.setAttribute('aria-checked', String(p.i === +b.dataset.i)));
    el.classList.toggle('done', p.i != null);
  } else {
    const tmp = document.createElement('div'); tmp.innerHTML = itemHTML(BYID[id]); el.replaceWith(tmp.firstElementChild);
  }
  progress();
}

function saveLocal() { try { localStorage.setItem(LSK, JSON.stringify(picks)); } catch (e) {} }

let toastT = null;
function toast(msg) {
  let t = document.querySelector('.toast'); if (!t) { t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
  t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2200);
}

/* 저장: db가 되면 한 문서(state/picks)에 항목별로 합쳐 쓰기, 안 되면 이 기기 브라우저에만 */
let ref = null, exists = false, ro = false, chain = Promise.resolve();
function setMode(m) {
  const el = $('mode');
  if (m === 'db') { el.textContent = '☁ 자동 저장 — 채팅에 “결정했어”라고만 하시면 돼요'; el.className = 'mode on'; }
  else if (m === 'ro') { el.textContent = '읽기 전용 — 저장 권한이 없어요'; el.className = 'mode'; }
  else { el.textContent = '이 기기에만 저장 — 다 고른 뒤 [결정 복사] → 채팅에 붙여 넣기'; el.className = 'mode'; }
}
function entry(id) { const p = picks[id]; return p ? {i: p.i ?? null, p: p.i != null ? BYID[id].opts[p.i].label : null, n: p.n || '', at: p.at || ''} : {i: null, p: null, n: '', at: ''}; }
function persist(ids) {
  saveLocal();
  if (!ref || ro) return;
  const patch = {}; for (const id of ids) patch[id] = entry(id);
  chain = chain.then(async () => {
    try {
      if (!exists) { const all = {}; for (const id of Object.keys(picks)) all[id] = entry(id); await ref.set({items: all, v: 1}); exists = true; }
      else await ref.update({items: patch});
    } catch (e) {
      if (e && (e.code === 'invalid_argument' || e.code === 'transform_error')) { ro = true; setMode('ro'); }
      else toast('저장이 안 됐어요 — 잠시 뒤 다시 눌러 주세요');
    }
  });
}
function applyRemote(items) {
  const next = {};
  for (const [id, v] of Object.entries(items || {})) {
    if (!BYID[id] || !v) continue;
    if (v.i != null || v.n) next[id] = {i: v.i ?? null, n: v.n || '', at: v.at || ''};
  }
  const changed = Object.keys({...picks, ...next}).filter(id => JSON.stringify(picks[id] || null) !== JSON.stringify(next[id] || null));
  picks = next; saveLocal();
  if (changed.length > 20) render(); else changed.forEach(refreshItem);
  summaryCounts();
}
function summaryCounts() { progress(); }

(async () => {
  let db = null;
  try { db = window.claude && window.claude.use ? await window.claude.use('db') : null; } catch (e) { db = null; }
  if (!db) { setMode('local'); return; }
  try {
    ref = db.doc('state/picks');
    const s = await ref.get();
    exists = s.exists;
    if (s.exists) applyRemote((s.data() || {}).items);
    else if (Object.keys(picks).length) persist(Object.keys(picks));
    setMode('db');
    ref.onSnapshot(snap => { if (snap.exists) { exists = true; if (!snap.metadata.hasPendingWrites) applyRemote((snap.data() || {}).items); } }, () => { setMode('local'); });
  } catch (e) { ref = null; setMode('local'); }
})();

/* 손놀림 */
document.addEventListener('click', e => {
  const sj = e.target.closest('[data-sj]');
  if (sj) { view.sj = sj.dataset.sj; try { history.replaceState(null, '', view.sj ? '#' + view.sj : location.pathname + location.search); } catch (er) {} render(); window.scrollTo({top: $('bar').offsetTop - 4}); return; }
  const o = e.target.closest('.opt');
  if (o) {
    const id = o.dataset.id, i = +o.dataset.i, p = picks[id] || {};
    if (p.i === i) { if (p.n) picks[id] = {i: null, n: p.n, at: new Date().toISOString()}; else delete picks[id]; }
    else picks[id] = {i, n: p.n || '', at: new Date().toISOString()};
    refreshItem(id); persist([id]);
    if (view.open && isPicked(id)) { const el = $('it-' + id); if (el) setTimeout(() => { if (isPicked(id) && view.open) render(); }, 700); }
  }
});
const noteT = {};
document.addEventListener('input', e => {
  const n = e.target.closest('.note'); if (!n) return;
  const id = n.dataset.id;
  clearTimeout(noteT[id]);
  noteT[id] = setTimeout(() => {
    const p = picks[id] || {i: null};
    const v = n.value.trim();
    if (!v && p.i == null) delete picks[id]; else picks[id] = {i: p.i ?? null, n: v, at: new Date().toISOString()};
    persist([id]); progress();
  }, 700);
});
$('fsure').addEventListener('change', e => { view.sure = e.target.value; render(); });
$('fcat').addEventListener('change', e => { view.cat = e.target.value; render(); });
$('fopen').addEventListener('click', e => { view.open = !view.open; e.currentTarget.setAttribute('aria-pressed', String(view.open)); render(); });
$('brec').addEventListener('click', () => {
  const scope = ALL.filter(it => (!view.sj || it.sid === view.sj) && !isPicked(it.id));
  const ids = [];
  for (const it of scope) { const r = it.opts.findIndex(o => o.rec); if (r >= 0) { picks[it.id] = {i: r, n: (picks[it.id] || {}).n || '', at: new Date().toISOString()}; ids.push(it.id); } }
  if (!ids.length) { toast('채울 항목이 없어요'); return; }
  render(); persist(ids);
  toast(`${view.sj ? sjLabel(view.sj) + ' ' : ''}안 고른 ${ids.length}개를 추천대로 채웠어요`);
});
function copyText() {
  const lines = ['[JB 전수 검토 결정 — ' + new Date().toLocaleString('ko-KR') + ']'];
  for (const s of SUBJ) {
    const its = s.items.filter(it => picks[it.id] && (picks[it.id].i != null || picks[it.id].n));
    const left = s.items.length - s.items.filter(it => isPicked(it.id)).length;
    if (!its.length && !left) continue;
    lines.push('', `■ ${sjLabel(s.sid)}${left ? ` (안 고름 ${left})` : ''}`);
    for (const it of its) {
      const p = picks[it.id];
      const label = p.i != null ? `${'①②③④⑤'[p.i]} ${it.opts[p.i].label}` : '(안 고름)';
      lines.push(`${sjLabel(it.sid)}-${it.num} ${it.title} → ${label}${p.n ? ` / 메모: ${p.n}` : ''}`);
    }
  }
  return lines.join('\n');
}
$('bcopy').addEventListener('click', async () => {
  const t = copyText(); $('ctext').value = t; $('cpanel').hidden = false;
  try { await navigator.clipboard.writeText(t); toast('복사했어요 — 채팅에 붙여 넣어 주세요'); }
  catch (e) { $('ctext').focus(); $('ctext').select(); toast('아래 글을 복사해 주세요'); }
});
$('cclose').addEventListener('click', () => { $('cpanel').hidden = true; });

summary(); render();
</script>
